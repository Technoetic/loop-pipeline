<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 445" role="img" aria-labelledby="title desc"><title id="title">Coffee order data pipeline</title><desc id="desc">Coffee packets travel through filter, map and reduce stations to preserve one result.</desc><defs><linearGradient id="pipe" x2="1" y2="1"><stop stop-color="#4567ff"/><stop offset="1" stop-color="#a9c0ff"/></linearGradient><linearGradient id="lime" x2="1" y2="1"><stop stop-color="#d3ff62"/><stop offset="1" stop-color="#90ba3c"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#344c4b"/><stop offset="1" stop-color="#172522"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter><g id="packet"><path d="m0 0 28-15 30 17-29 17Z" fill="#6f8ef9"/><path d="m0 0 29 19v28L0 29Z" fill="#2443a0"/><path d="m29 19 29-17v29L29 47Z" fill="#3b5be0"/><path d="m17-8 29 18v9" fill="none" stroke="#bdc9ff" stroke-width="3"/><path d="m37 26 11-6v5l-11 6" fill="#aec4ff"/></g><g id="cup"><path d="m0 0 17-10 19 11-18 11Z" fill="#edf6de"/><path d="m0 0 18 12v24L4 27Z" fill="#9dac8c"/><path d="m18 12 18-11-4 27-14 8Z" fill="#d3ff62"/><path d="m-2-3 19-11 21 12-20 12Z" fill="#344928"/><path d="m-2-3 20 12 20-11" fill="none" stroke="#d3ff62" stroke-width="3"/></g><g id="bolt"><circle r="2" fill="#8b9f94"/><circle r=".7" fill="#182921"/></g></defs><style>.flow{stroke-dasharray:7 9;animation:travel 1.8s linear infinite}.packet1{animation:bob 3s ease-in-out infinite}.packet2{animation:bob 3s -.9s ease-in-out infinite}.packet3{animation:bob 3s -1.8s ease-in-out infinite}.lit{animation:pulse 2s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-64}}@keyframes bob{50%{opacity:.65}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g fill="none" stroke="#34464a" stroke-width="1"><path d="M49 295 280 428 527 285M30 272 280 416 538 266M55 326l42-24m36 62 45-25m36 65 45-26M308 412l-48-28m109-7-49-28m110-7-49-28m110-7-49-28